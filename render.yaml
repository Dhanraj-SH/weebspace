services:
  - type: web
    name: weebspace-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_URL
        value: https://weebspace.vercel.app
      - key: CORS_ORIGINS
        value: https://weebspace.vercel.app
